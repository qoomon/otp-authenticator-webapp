<!doctype html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta name="theme-color" content="#292929" />
    <title>OTP Auth+</title>
    <link rel=icon href=favicon.ico>
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@100;200;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
    <link id="dark-mode" rel="stylesheet" href="index_dark.css" disabled>
    <script src="main.js" defer></script>
  </head>
  <body>
    <!-- Password prompt overlay -->
    <div id="password-overlay" style="display: none;">
      <div id="password-dialog">
        <h2 id="password-title">Enter Password</h2>
        <p id="password-message">Your keys are encrypted. Please enter your password to unlock.</p>
        <input type="password" id="password-input" placeholder="Password" autocomplete="current-password">
        <input type="password" id="password-confirm" placeholder="Confirm Password" autocomplete="new-password" style="display: none;">
        <div id="password-actions">
          <button id="password-submit">Unlock</button>
          <button id="password-cancel" style="display: none;">Cancel</button>
        </div>
        <div id="password-error" style="display: none;"></div>
      </div>
    </div>
    
    <div id="header-container">
      <div id="app-icon"></div>
      <div id="app-name">OTP Auth+</div>
      <input id="search-input" type="text" placeholder="Search keys..." autocomplete="off">
      <div id="header-actions">
        <div id="lock-icon" title="Lock/Unlock encryption"></div>
        <div id="export-icon" title="Export all keys"></div>
        <div id="import-icon" title="Import keys">
          <input type="file" id="import-file" accept=".json" style="display: none;">
        </div>
        <div id="add-key-icon" title="Add new key"></div>
        <div id="clear-all-icon" title="Clear all keys"></div>
      </div>
    </div>
    
    <div id="entries-list-container">
      <div id="entries-list"></div>
    </div>
    <div id="calculator-container">
      <div id="totp-label" style="margin-bottom: 0px; height: 0px;"></div>
      <div id="totp-token-container">
        <div id="totp-token"></div>
        <svg id="totp-token-remaining-seconds-pie" viewBox="0 0 0.318310 0.318310">
          <!-- r = 1 / (2 * PI) ≈ 0.159155 -->
          <circle r="0.159155"  cx="0.159155" cy="0.159155"/>
        </svg>
      </div>
      
      <div id="input-container">
        <div id="input-secret-container">
          <input id="input-secret" placeholder="Secret or OTP Auth URI" type="password" autocomplete="off" autofocus>
          
          <div id="input-video-button"></div>
          <label id="input-image-button" style=" display: inline-block;">
              <input id="input-image" type="file" style="display: none;">
          </label>
          <div id="more-button"></div>
        </div>
        
        <input id="input-account" placeholder="Account" style="display: none;">
        <input id="input-issuer" placeholder="Issuer" style="display: none;">
        <input id="input-period" type="number" placeholder="Period" style="display: none;">
      </div>
      
      <div id="otpauth-qr" style="display: none;">
        <img id="otpauth-qr-image">
        <div id="otpauth-qr-overlay">Missing values!</div>
      </div>
    </div>
    <a id="github-ref" href="https://github.com/rorph/otp-authenticator-webapp" target="_blank"></a>
    <div id="app-version"></div>
    <div id="light-switch"></div>
    
    <div id="input-video-dialog" style="display: none;">
      <div id="input-video-container">
        <video id="input-video"></video>
      </div>
    </div>
    
  </body>
</html>
